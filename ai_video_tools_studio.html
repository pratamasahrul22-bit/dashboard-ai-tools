    <script>
        /**
         * ============================================================================
         * AI VIDEO TOOLS STUDIO — CORE ARCHITECTURE & STATE MANAGEMENT
         * ============================================================================
         */
        const STORAGE_KEYS = {
            PROJECTS: 'aivideo_studio_projects_v1',
            SETTINGS: 'aivideo_studio_settings_v1',
            RUNTIME_KEY: 'aivideo_studio_gemini_runtime_key'
        };

        const defaultSettings = {
            lang: 'id',
            profile: {
                name: 'Creator Studio',
                niche: 'Tech, Edukasi & Lifestyle'
            },
            videoIntegration: {
                provider: 'none',
                endpointUrl: ''
            }
        };

        function loadSettings() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.SETTINGS);
                if (!raw) return structuredClone(defaultSettings);
                const parsed = JSON.parse(raw);
                return {
                    ...defaultSettings,
                    ...parsed,
                    profile: { ...defaultSettings.profile, ...(parsed.profile || {}) },
                    videoIntegration: { ...defaultSettings.videoIntegration, ...(parsed.videoIntegration || {}) }
                };
            } catch {
                return structuredClone(defaultSettings);
            }
        }

        function loadProjects() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.PROJECTS);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        const savedSettings = loadSettings();

        const state = {
            currentTab: 'dashboard',
            sidebarCollapsed: false,
            lang: savedSettings.lang,
            profile: savedSettings.profile,
            videoIntegration: savedSettings.videoIntegration,
            projects: loadProjects(),
            workspace: {
                lastScript: '',
                lastScriptData: null,
                lastStoryboard: []
            }
        };

        function persistSettings() {
            try {
                localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify({
                    lang: state.lang,
                    profile: state.profile,
                    videoIntegration: state.videoIntegration
                }));
            } catch (e) {
                console.warn('Gagal menyimpan pengaturan lokal:', e);
            }
        }

        function persistProjects() {
            try {
                localStorage.setItem(STORAGE_KEYS.PROJECTS, JSON.stringify(state.projects));
                updateProjectBadge();
            } catch (e) {
                console.warn('Gagal menyimpan proyek lokal:', e);
            }
        }

        function saveProject(type, title, content) {
            const newProject = {
                id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type,
                title: title || 'Untitled Project',
                content: typeof content === 'string' ? content : JSON.stringify(content, null, 2),
                createdAt: new Date().toISOString()
            };
            state.projects.unshift(newProject);
            persistProjects();
            showToast(state.lang === 'id' ? 'Berhasil disimpan ke My Projects!' : 'Saved to My Projects!', 'success');
        }

        function deleteProject(id) {
            state.projects = state.projects.filter(p => p.id !== id);
            persistProjects();
            renderView();
            showToast(state.lang === 'id' ? 'Proyek dihapus.' : 'Project deleted.', 'info');
        }

        function updateProjectBadge() {
            const badge = document.getElementById('project-count-badge');
            if (badge) badge.textContent = state.projects.length;
        }

            const name = state.profile.name || 'Creator Studio';
            const initials = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'CR';

            const nameEl = document.getElementById('header-username');
            if (avatarEl) avatarEl.textContent = initials;
            if (nameEl) nameEl.textContent = name;
        }

        function t(key) {
            return i18n[state.lang]?.[key] || i18n['id'][key] || key;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const colors = {
                success: 'bg-emerald-950/90 border-emerald-500/50 text-emerald-100',
                error: 'bg-rose-950/90 border-rose-500/50 text-rose-100',
                warning: 'bg-amber-950/90 border-amber-500/50 text-amber-100',
                info: 'bg-[#13131f]/95 border-purple-500/50 text-slate-100'
            };
            const el = document.createElement('div');
            el.className = `pointer-events-auto px-4 py-3 rounded-xl border backdrop-blur-md text-xs font-semibold shadow-xl transition-all duration-300 ${colors[type] || colors.info}`;
            el.textContent = message;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(8px)';
                setTimeout(() => el.remove(), 300);
            }, 3400);
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(t('copied'), 'success');
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast(t('copied'), 'success');
            }
        }

        function renderBackToDashboardBar(badgeText = 'AI STUDIO MODULE') {
            return `
                <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                    <button onclick="navigateTo('dashboard')" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-[#13131f] hover:bg-[#1b1b2b] border border-[#1f1f33] hover:border-purple-500/40 text-xs font-semibold text-slate-200 transition">

                        <span>${t('backToDashboard')}</span>

                    <span class="text-[11px] font-bold tracking-wider uppercase px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/25 text-purple-300">
                        ${escapeHtml(badgeText)}
                    </span>
                </div>
            `;
        }

        /**
         * ============================================================================
         * GEMINI API GATEWAY (UNIFIED CLIENT + SERVER-ENDPOINT COMPATIBILITY)
         * ============================================================================
         */
        const GEMINI_TEXT_MODEL = 'gemini-3-flash-preview';
        const GEMINI_TTS_MODEL = 'gemini-2.5-flash-preview-tts';

        function getActiveGeminiKey() {
            const envKey = (typeof window !== 'undefined' && window.GEMINI_API_KEY) ? String(window.GEMINI_API_KEY).trim() : '';
            const sessionKey = sessionStorage.getItem(STORAGE_KEYS.RUNTIME_KEY) || '';
            return envKey || sessionKey.trim();
        }

        function updateApiStatusIndicator() {
            const dot = document.getElementById('api-status-dot');
            if (!dot) return;
            const hasKey = Boolean(getActiveGeminiKey());
            dot.className = hasKey
                ? 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse'
                : 'w-2 h-2 rounded-full bg-amber-400';
        }

        async function callGeminiStructuredScript({ topic, language, duration, style }) {
            // 1. Coba panggil server-side endpoint /api/generate-script jika berjalan di backend Node.js
            try {
                const serverRes = await fetch('/api/generate-script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, language, duration, style })
                });

                if (serverRes.ok) {
                    return await serverRes.json();
                }

                // Jika server merespons 503 atau error terstruktur dan tidak ada fallback key di sesi
                if (serverRes.status !== 404 && serverRes.status !== 405 && !getActiveGeminiKey()) {
                    const errJson = await serverRes.json().catch(() => ({}));
                    const err = new Error(errJson.message || `Server mengembalikan status ${serverRes.status}`);
                    err.code = errJson.code || 'SERVER_ERROR';
                    throw err;
                }
            } catch (networkErr) {
                if (networkErr.code === 'MISSING_GEMINI_API_KEY' || networkErr.code === 'GEMINI_UPSTREAM_ERROR') {
                    throw networkErr;
                }
            }

            // 2. Fallback langsung ke Gemini API jika berjalan dalam preview browser statis
            const apiKey = getActiveGeminiKey();
            if (!apiKey) {
                const cfgErr = new Error(
                    state.lang === 'id'
                        ? 'GEMINI_API_KEY belum dikonfigurasi. Atur GEMINI_API_KEY di environment server atau masukkan kunci sesi Anda pada menu Settings.'
                        : 'GEMINI_API_KEY is not configured. Set GEMINI_API_KEY in server environment or enter a session key in Settings.'
                );
                cfgErr.code = 'MISSING_GEMINI_API_KEY';
                throw cfgErr;
            }

            const responseSchema = {
                type: 'OBJECT',
                properties: {
                    videoTitle: { type: 'STRING' },
                    openingHook: { type: 'STRING' },
                    narrationScript: { type: 'STRING' },
                    sceneBreakdown: {
                        type: 'ARRAY',
                        items: {
                            type: 'OBJECT',
                            properties: {
                                sceneNumber: { type: 'INTEGER' },
                                timeRange: { type: 'STRING' },
                                visual: { type: 'STRING' },
                                audioNarration: { type: 'STRING' }
                            },
                            required: ['sceneNumber', 'timeRange', 'visual', 'audioNarration']
                        }
                    },
                    closingCta: { type: 'STRING' },
                    caption: { type: 'STRING' },
                    hashtags: {
                        type: 'ARRAY',
                        items: { type: 'STRING' }
                    }
                },
                required: [
                    'videoTitle',
                    'openingHook',
                    'narrationScript',
                    'sceneBreakdown',
                    'closingCta',
                    'caption',
                    'hashtags'
                ]
            };

            const systemInstruction = `You are a professional short-form & long-form video scriptwriter for TikTok, Instagram Reels, and YouTube.
Generate a complete video production script in ${language}.
- Topic: ${topic}
- Duration: ${duration} seconds
- Style: ${style}
Ensure the response strictly returns valid JSON matching the schema with:
1. videoTitle (Judul video)
2. openingHook (Hook pembuka 3-5 detik pertama)
3. narrationScript (Naskah narasi lengkap sesuai durasi ${duration} detik)
4. sceneBreakdown (Pembagian adegan dengan sceneNumber, timeRange, visual, audioNarration)
5. closingCta (CTA penutup)
6. caption (Caption media sosial)
7. hashtags (Daftar 6-10 hashtag relevan diawali #)`;

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_TEXT_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    contents: [{
                        role: 'user',
                        parts: [{ text: `Buatkan naskah video berdurasi ${duration} detik bergaya ${style} dalam bahasa ${language} tentang topik: ${topic}` }]
                    }],
                    generationConfig: {
                        responseMimeType: 'application/json',
                        responseSchema
                    }
                })
            });

            if (!res.ok) {
                const detail = await res.text();
                throw new Error(`Gemini API Error (${res.status}): ${detail.slice(0, 180)}`);
            }

            const data = await res.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawText) throw new Error('Respons Gemini API kosong.');
            return JSON.parse(rawText);
        }

        async function callGeminiText(prompt, systemPrompt = 'You are an expert AI video creator assistant.', jsonSchema = null) {
            const apiKey = getActiveGeminiKey();
            if (!apiKey) {
                throw new Error(
                    state.lang === 'id'
                        ? 'GEMINI_API_KEY belum dikonfigurasi. Silakan masukkan Gemini API Key sesi pada halaman Settings.'
                        : 'GEMINI_API_KEY is not configured. Please enter a session Gemini API Key in Settings.'
                );
            }

            const generationConfig = jsonSchema
                ? { responseMimeType: 'application/json', responseSchema: jsonSchema }
                : {};

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_TEXT_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Gemini API Error (${res.status}): ${errText.slice(0, 180)}`);
            }

            const json = await res.json();
            const text = json?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Gemini API mengembalikan respons kosong.');
            return text;
        }

        async function callGeminiTTS(text, voiceName = 'Kore') {
            const apiKey = getActiveGeminiKey();
            if (!apiKey) {
                throw new Error(
                    state.lang === 'id'
                        ? 'GEMINI_API_KEY belum dikonfigurasi. Silakan atur kunci API di halaman Settings untuk menjalankan Gemini TTS.'
                        : 'GEMINI_API_KEY is not configured. Please set your API key in Settings to run Gemini TTS.'
                );
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_TTS_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text }] }],
                    generationConfig: {
                        responseModalities: ['AUDIO'],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName }
                            }
                        }
                    }
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Gemini TTS Error (${res.status}): ${errText.slice(0, 180)}`);
            }

            const json = await res.json();
            const inlineData = json?.candidates?.[0]?.content?.parts?.[0]?.inlineData;
            if (!inlineData?.data) {
                throw new Error('Model TTS tidak mengembalikan data audio.');
            }
            return pcmBase64ToWavBlobUrl(inlineData.data, 24000);
        }

        function pcmBase64ToWavBlobUrl(base64Pcm, sampleRate = 24000) {
            const binaryString = atob(base64Pcm);
            const pcmLength = binaryString.length;
            const wavBuffer = new ArrayBuffer(44 + pcmLength);
            const view = new DataView(wavBuffer);

            const writeString = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + pcmLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmLength, true);

            const bytes = new Uint8Array(wavBuffer, 44);
            for (let i = 0; i < pcmLength; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        }

        async function handleGenerateScript() {
            const topic = document.getElementById('script-topic')?.value.trim();
            const language = document.getElementById('script-lang')?.value || 'Indonesian';
            const duration = document.getElementById('script-duration')?.value || '60';
            const style = document.querySelector('input[name="script-style"]:checked')?.value || 'edukasi';

            if (!topic) {
                showToast(state.lang === 'id' ? 'Mohon masukkan topik video terlebih dahulu.' : 'Please enter a video topic first.', 'warning');
                return;
            }

            const btn = document.getElementById('btn-generate-script');
            const outputBox = document.getElementById('script-output-container');
            const pipelineBar = document.getElementById('script-pipeline-bar');

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>${t('generating')}</span>`;
            outputBox.innerHTML = `
                <div class="min-h-[320px] flex flex-col items-center justify-center text-center p-6 animate-neon-border rounded-xl">
                    <i data-lucide="loader-2" class="w-9 h-9 text-purple-400 animate-spin mb-3"></i>
                    <p class="text-sm font-bold text-white">${t('generating')}</p>
                    <p class="text-xs text-slate-400 mt-1">${state.lang === 'id' ? 'Menyusun hook, narasi, adegan, CTA & hashtag...' : 'Structuring hook, narration, scenes, CTA & hashtags...'}</p>
                </div>
            `;
            lucide.createIcons();

            try {
                const structured = await callGeminiStructuredScript({ topic, language, duration, style });
                state.workspace.lastScriptData = structured;
                state.workspace.lastScript = formatStructuredScriptToText(structured);
                if (Array.isArray(structured.sceneBreakdown)) {
                    state.workspace.lastStoryboard = structured.sceneBreakdown.map(s => ({
                        sceneNumber: s.sceneNumber,
                        duration: s.timeRange,
                        narration: s.audioNarration,
                        visualDescription: s.visual,
                        imagePrompt: `Cinematic vertical 9:16 shot, ${s.visual}, dramatic studio lighting, ultra detailed, 8k`
                    }));
                }

                outputBox.innerHTML = renderStructuredScriptCards(structured);
                if (pipelineBar) {
                    pipelineBar.classList.remove('hidden');
                    pipelineBar.classList.add('flex');
                }
                showToast(state.lang === 'id' ? 'Naskah video berhasil dibuat!' : 'Video script generated successfully!', 'success');
            } catch (err) {
                const isMissingKey = err.code === 'MISSING_GEMINI_API_KEY';
                outputBox.innerHTML = `
                    <div class="p-5 rounded-xl bg-rose-950/35 border border-rose-500/40 space-y-3">

                        <p class="text-xs text-rose-200 leading-relaxed">${escapeHtml(err.message)}</p>
                        ${isMissingKey ? `

                                <p class="font-bold text-white">Cara Mengaktifkan Gemini API:</p>
                                <p>1. Dapatkan API Key gratis dari <strong>Google AI Studio</strong>.</p>
                                <p>2. Klik tombol di bawah untuk mengatur kunci sesi pada halaman <strong>Settings</strong> (tanpa mengaktifkan billing berbayar).</p>
                                <button onclick="navigateTo('settings')" class="mt-2 px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs inline-flex items-center gap-1.5">
                                    <i data-lucide="settings" class="w-3.5 h-3.5"></i> Buka Settings Konfigurasi API
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span>Generate Script</span>`;
                lucide.createIcons();
            }
        }

        async function handleGenerateStoryboard() {

            const btn = document.getElementById('btn-generate-storyboard');
            const grid = document.getElementById('storyboard-grid');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>${t('generating')}</span>`;
            grid.innerHTML = `<div class="md:col-span-2 p-10 rounded-2xl bg-[#13131f] border border-cyan-500/30 text-center"><i data-lucide="loader-2" class="w-8 h-8 text-cyan-400 animate-spin mx-auto mb-2"></i><p class="text-xs font-bold text-white">${t('generating')}</p></div>`;
            lucide.createIcons();

            const schema = {
                type: 'ARRAY',
                items: {
                    type: 'OBJECT',
                    properties: {
                        sceneNumber: { type: 'INTEGER' },
                        duration: { type: 'STRING' },
                        visualDescription: { type: 'STRING' },
                        narration: { type: 'STRING' },
                        imagePrompt: { type: 'STRING' }
                    },
                    required: ['sceneNumber', 'duration', 'visualDescription', 'narration', 'imagePrompt']
                }
            };

            try {
                const raw = await callGeminiText(
                    `Break down this video script into detailed visual storyboard scenes. Include sceneNumber, duration (e.g., "0:00 - 0:05"), visualDescription, narration, and a detailed English imagePrompt for AI image/video generation.\n\nScript:\n${scriptInput}`,
                    'You are a professional film director and storyboard artist.',
                    schema
                );
                const scenes = JSON.parse(raw);
                state.workspace.lastStoryboard = scenes;
                grid.innerHTML = renderStoryboardCards(scenes);
                showToast(state.lang === 'id' ? 'Storyboard berhasil dibuat!' : 'Storyboard generated!', 'success');
            } catch (err) {
                grid.innerHTML = `<div class="md:col-span-2 p-4 rounded-xl bg-rose-950/40 border border-rose-500/40 text-xs text-rose-200">${escapeHtml(err.message)}</div>`;
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="film" class="w-4 h-4"></i><span>${state.lang === 'id' ? 'Generate AI Storyboard' : 'Generate AI Storyboard'}</span>`;

        function downloadSubtitleFile() {
            if (!lastSubtitleOutput?.subtitleText) return;
            const ext = lastSubtitleOutput.format === 'VTT' ? 'vtt' : 'srt';
            const blob = new Blob([lastSubtitleOutput.subtitleText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ai-video-tools-studio.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function handleGenerateAutoSubtitle() {
            const input = document.getElementById('subtitle-input').value.trim();
            const format = document.getElementById('subtitle-format').value;
            const pacing = document.getElementById('subtitle-pacing').value;

            if (!input) {
                showToast(state.lang === 'id' ? 'Masukkan teks narasi terlebih dahulu.' : 'Please enter narration text first.', 'warning');
                return;
            }

            const btn = document.getElementById('btn-generate-subtitle');
            const resultsEl = document.getElementById('subtitle-results');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>${t('generating')}</span>`;
            resultsEl.innerHTML = `
                <div class="p-10 rounded-2xl bg-[#13131f] border border-emerald-500/30 text-center animate-neon-border">
                    <i data-lucide="loader-2" class="w-8 h-8 text-emerald-400 animate-spin mx-auto mb-2"></i>
                    <p class="text-sm font-bold text-white">${t('generating')}</p>
                </div>
            `;
            lucide.createIcons();

            const pacingRule = pacing === 'short-punchy'
                ? 'Split into short, punchy 3 to 5 word phrases ideal for TikTok/Reels dynamic captions.'
                : 'Split into natural, readable 8 to 12 word subtitle lines ideal for YouTube.';

            const formatRule = format === 'VTT'
                ? 'Output strictly valid WebVTT format starting with WEBVTT and timestamps like 00:00:00.000 --> 00:00:02.500.'
                : 'Output strictly valid SubRip (.SRT) format with sequential index numbers (1, 2, 3...) and timestamps like 00:00:00,000 --> 00:00:02,500.';

            const prompt = `Convert the following narration script into realistic, accurately paced video subtitles.
${formatRule}
${pacingRule}
Return ONLY the raw ${format} subtitle text without markdown code blocks or extra commentary.

Script:
${input}`;

            try {
                const subtitleText = await callGeminiText(prompt, "You are a professional video captioning and subtitling specialist.");
                const cleaned = subtitleText.replace(/^```[a-z]*\n?/i, '').replace(/```$/i, '').trim();
                lastSubtitleOutput = { format, subtitleText: cleaned };
                resultsEl.innerHTML = renderSubtitleResultCard(lastSubtitleOutput);
                showToast(state.lang === 'id' ? `Subtitle ${format} berhasil dibuat!` : `${format} subtitles generated!`, 'success');
            } catch (err) {
                resultsEl.innerHTML = `<div class="p-4 rounded-xl bg-rose-950/40 border border-rose-500/40 text-xs text-rose-200">${escapeHtml(err.message)}</div>`;
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="captions" class="w-4 h-4"></i><span>${state.lang === 'id' ? 'Generate Auto Subtitle' : 'Generate Auto Subtitle'}</span>`;
                lucide.createIcons();
            }
        }

        /**
         * ============================================================================
         * VIEW 8: MY PROJECTS (LOCAL STORAGE PERSISTENCE)
         * ============================================================================
         */
        function renderProjectsView() {
            updateHeaderInfo(
                'My Projects',
                state.lang === 'id'
                    ? 'Semua naskah, storyboard, dan subtitle tersimpan secara lokal di browser Anda'
                    : 'All saved scripts, storyboards, and subtitles stored locally in your browser'
            );

            if (state.projects.length === 0) {
                return `
                    ${renderBackToDashboardBar('My Projects • Local Storage')}
                    <div class="rounded-3xl bg-[#13131f] border border-dashed border-[#1f1f33] p-12 text-center max-w-xl mx-auto my-8 space-y-4">
                        <div class="w-14 h-14 rounded-2xl bg-purple-500/15 border border-purple-500/30 flex items-center justify-center text-purple-400 mx-auto">
                            <i data-lucide="folder-kanban" class="w-7 h-7"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white">${state.lang === 'id' ? 'Belum Ada Proyek Tersimpan' : 'No Saved Projects Yet'}</h3>
                        <p class="text-xs text-slate-400 leading-relaxed">${t('noProjectsYet')}</p>
                        <button onclick="navigateTo('script')" class="neon-btn px-5 py-2.5 rounded-xl text-xs font-bold text-white inline-flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>${t('createNewVideo')}</span>
                        </button>
                    </div>
                `;
            }

            return `
                ${renderBackToDashboardBar('My Projects • Local Storage')}
                <div class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${state.projects.map(p => `
                            <div class="rounded-2xl bg-[#13131f] border border-[#1f1f33] p-5 flex flex-col justify-between gap-4">
                                <div class="space-y-2">
                                    <div class="flex items-center justify-between gap-2">
                                        <span class="px-2.5 py-0.5 rounded-md bg-purple-500/15 text-purple-300 text-[10px] font-extrabold uppercase">${escapeHtml(p.type)}</span>
                                        <span class="text-[11px] text-slate-500">${new Date(p.createdAt).toLocaleString()}</span>
                                    </div>
                                    <h4 class="text-base font-bold text-white">${escapeHtml(p.title)}</h4>
                                    <pre class="p-3 rounded-xl bg-[#0a0a12] border border-[#1f1f33] text-xs text-slate-300 whitespace-pre-wrap max-h-44 overflow-y-auto font-sans">${escapeHtml(p.content)}</pre>
                                </div>
                                <div class="flex items-center justify-between pt-3 border-t border-white/5">
                                    <button onclick="copyToClipboard(${JSON.stringify(p.content)})" class="px-3 py-1.5 rounded-lg bg-cyan-500/15 text-cyan-300 text-xs font-bold flex items-center gap-1.5">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy
                                    </button>
                                    <button onclick="deleteProject('${p.id}')" class="px-3 py-1.5 rounded-lg bg-rose-500/15 text-rose-300 text-xs font-bold flex items-center gap-1.5">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        /**
         * ============================================================================
         * VIEW 9: SETTINGS (PROFILE, LANGUAGE, THEME & VIDEO INTEGRATION)
         * ============================================================================
         */
        function renderSettingsView() {
            updateHeaderInfo(
                'Settings',
                state.lang === 'id'
                    ? 'Kelola profil kreator, preferensi bahasa, tema gelap, dan endpoint model video'
                    : 'Manage creator profile, language preferences, dark theme, and video model endpoints'
            );

            const hasRuntimeKey = Boolean(sessionStorage.getItem(STORAGE_KEYS.RUNTIME_KEY));

            return `
                ${renderBackToDashboardBar('Settings • Studio Preferences')}
                <div class="max-w-3xl space-y-6">
                    <!-- Creator Profile -->
                    <div class="rounded-2xl bg-[#13131f] border border-[#1f1f33] p-6 space-y-4">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i data-lucide="user" class="w-4 h-4 text-purple-400"></i>
                            <span>Profil Kreator & Bahasa</span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="block text-xs font-semibold text-slate-300">Nama Studio / Kreator</label>
                                <input id="set-profile-name" type="text" value="${escapeHtml(state.profile.name)}"
                                    class="w-full rounded-xl bg-[#0a0a12] border border-[#1f1f33] p-3 text-xs text-white outline-none" />
                            </div>
                            <div class="space-y-1.5">
                                <label class="block text-xs font-semibold text-slate-300">Bahasa Antarmuka</label>
                                <select id="set-lang" class="w-full rounded-xl bg-[#0a0a12] border border-[#1f1f33] p-3 text-xs text-white outline-none">
                                    <option value="id" ${state.lang === 'id' ? 'selected' : ''}>Bahasa Indonesia</option>
                                    <option value="en" ${state.lang === 'en' ? 'selected' : ''}>English</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Gemini API Session Configuration -->
                    <div class="rounded-2xl bg-[#13131f] border border-[#1f1f33] p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                                <i data-lucide="key-round" class="w-4 h-4 text-cyan-400"></i>
                                <span>Konfigurasi Gemini API (Google AI Studio)</span>
                            </h3>
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${getActiveGeminiKey() ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">
                                ${getActiveGeminiKey() ? 'Aktif' : 'Belum Diatur'}
                            </span>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed">
                            Jika backend Node.js Anda belum menyuntikkan secret <code>GEMINI_API_KEY</code>, Anda dapat memasukkan kunci API sementara (disimpan hanya di <code>sessionStorage</code> browser dan tidak pernah ditampilkan kembali).
                        </p>
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input id="set-gemini-session-key" type="password"
                                placeholder="${hasRuntimeKey ? '•••••••••••••••• (Tersimpan di sesi ini)' : 'Tempel GEMINI_API_KEY dari Google AI Studio...'}"
                                class="flex-1 rounded-xl bg-[#0a0a12] border border-[#1f1f33] p-3 text-xs text-white outline-none" />
                            <button onclick="saveRuntimeGeminiKey()" class="px-4 py-2.5 rounded-xl bg-cyan-600/30 hover:bg-cyan-600/40 border border-cyan-500/40 text-xs font-bold text-cyan-200">
                                Simpan Kunci Sesi
                            </button>
                        </div>
                    </div>

                    <!-- External Video Model Endpoint -->
                    <div class="rounded-2xl bg-[#13131f] border border-[#1f1f33] p-6 space-y-4">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i data-lucide="video" class="w-4 h-4 text-amber-400"></i>
                            <span>Integrasi Model Video AI Eksternal (Opsional)</span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="block text-xs font-semibold text-slate-300">Provider Video AI</label>
                                <select id="set-video-provider" class="w-full rounded-xl bg-[#0a0a12] border border-[#1f1f33] p-3 text-xs text-white outline-none">
                                    <option value="none" ${state.videoIntegration.provider === 'none' ? 'selected' : ''}>Tidak Ada (Mode Aman)</option>
                                    <option value="veo" ${state.videoIntegration.provider === 'veo' ? 'selected' : ''}>Google Veo Endpoint</option>
                                    <option value="runway" ${state.videoIntegration.provider === 'runway' ? 'selected' : ''}>Runway Gen-3 Endpoint</option>
                                    <option value="kling" ${state.videoIntegration.provider === 'kling' ? 'selected' : ''}>Kling AI Endpoint</option>
                                </select>
                            </div>
                            <div class="space-y-1.5">
                                <label class="block text-xs font-semibold text-slate-300">Webhook / Proxy URL</label>
                                <input id="set-video-endpoint" type="url" value="${escapeHtml(state.videoIntegration.endpointUrl)}"
                                    placeholder="https://api.domain-anda.com/video-render"
                                    class="w-full rounded-xl bg-[#0a0a12] border border-[#1f1f33] p-3 text-xs text-white outline-none" />
                            </div>
                        </div>
                    </div>

                    <button onclick="saveAllSettings()" class="neon-btn px-6 py-3 rounded-xl text-xs sm:text-sm font-bold text-white">
                        Simpan Semua Pengaturan
                    </button>
                </div>
            `;
        }

        function saveRuntimeGeminiKey() {
            const input = document.getElementById('set-gemini-session-key');
            const val = input?.value.trim();
            if (!val) {
                showToast('Masukkan Gemini API Key terlebih dahulu.', 'warning');
                return;
            }
            sessionStorage.setItem(STORAGE_KEYS.RUNTIME_KEY, val);
            input.value = '';
            updateApiStatusIndicator();
            renderView();
            showToast('Kunci sesi Gemini API berhasil disimpan!', 'success');
        }

        function saveAllSettings() {
            const name = document.getElementById('set-profile-name')?.value.trim() || 'Creator Studio';
            const lang = document.getElementById('set-lang')?.value || 'id';
            const provider = document.getElementById('set-video-provider')?.value || 'none';
            const endpointUrl = document.getElementById('set-video-endpoint')?.value.trim() || '';

            state.profile.name = name;
            state.lang = lang;
            state.videoIntegration = { provider, endpointUrl };

            persistSettings();
            updateProfileHeader();
            renderSidebar();
            renderView();
            showToast(state.lang === 'id' ? 'Pengaturan berhasil disimpan!' : 'Settings saved!', 'success');
        }

        /**
         * ============================================================================
         * MAIN ROUTER & INITIALIZATION
         * ============================================================================
         */
        function renderView() {
            const container = document.getElementById('main-content');
            if (!container) return;
            switch (state.currentTab) {
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    break;
                case 'script':
                    container.innerHTML = renderScriptGeneratorView();
                    break;
                case 'storyboard':
                    container.innerHTML = renderStoryboardView();
                    break;
                case 'text2video':
                    container.innerHTML = renderTextToVideoView();
                    break;
                case 'img2video':
                    container.innerHTML = renderImageToVideoView();
                    break;
                case 'voiceover':
                    container.innerHTML = renderVoiceOverView();
                    break;
                case 'subtitle':
                case 'caption':
                    container.innerHTML = renderAutoSubtitleView();
                    break;
                case 'projects':
                    container.innerHTML = renderProjectsView();
                    break;
                case 'settings':
                    container.innerHTML = renderSettingsView();
                    break;
                default:
                    container.innerHTML = renderDashboardView();
            }
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateProjectBadge();
            updateProfileHeader();
            updateApiStatusIndicator();
            renderSidebar();
            renderView();
        });
    </script>
</body>
</html>
